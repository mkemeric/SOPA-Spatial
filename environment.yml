# NOTE: This environment requires ~15 GB of disk space.
# If your home directory is small, set SPATCH_STORAGE before running setup:
#   export SPATCH_STORAGE=/mnt/user && bash setup_environment.sh
# See ENVIRONMENT_QUICKSTART.md for details.

name: spatch
channels:
  - conda-forge
  - pytorch
  - bioconda
dependencies:
# Python (pin to 3.12 for broad compatibility)
  - python=3.12

  # Core spatial data stack
  - pip
  - pip:
    # SpatialData + Sopa — pinned to validated versions.
    # See requirements-spatial-stack.txt for the canonical pins.
    - sopa==2.2.1
    - spatialdata==0.7.2
    - spatialdata-io==0.6.0
    - spatialdata-plot==0.2.14
    - zarr==3.1.5
    - ome-zarr==0.13.0
    - dask==2026.1.1

    # Single-cell analysis
    - scanpy==1.11.1
    - squidpy==1.6.2
    - anndata==0.12.10

    # Segmentation
    - cellpose>=3.0
    - opencv-python-headless

    # Spatial analysis
    - geopandas>=0.14
    - shapely>=2.0

    # Numerical computing
    - numpy>=1.24
    - scipy>=1.11
    - pandas>=2.0
    - scikit-learn>=1.3

    # Utilities
    - pyyaml>=6.0
    - matplotlib>=3.7
    - seaborn>=0.12
    - jupyter
    - ipykernel

    # SPATCH custom modules (editable install from local)
    # Run: pip install -e . --no-deps

    # Workflow orchestration (optional)
    # - snakemake>=8.0
