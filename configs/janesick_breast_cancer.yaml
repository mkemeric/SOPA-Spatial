# Janesick Breast Cancer Test Configuration
# Configuration for analyzing the 10x Genomics Janesick et al. (Nature Communications, 2023)
# FFPE Human Breast Cancer (Invasive Ductal Carcinoma with DCIS) sample
# Data from: https://github.com/10XGenomics/janesick_nature_comms_2023_companion

technology: xenium

# Input data path (absolute path to Xenium data)
data_path: /mnt/shared/janesick/input

# ═══════════════════════════════════════════════════════════════════
# SEGMENTATION (using existing Xenium segmentation)
# ═══════════════════════════════════════════════════════════════════
# The Janesick data comes with pre-computed segmentation from Xenium Ranger.
# We'll load the existing cell boundaries rather than re-segment.
# If re-segmentation is desired, uncomment the segmentation section below.

segmentation:
  use_existing: true  # Use Xenium Ranger segmentation from cells.parquet
  
  # Uncomment to re-segment with Cellpose (not typically needed)
  # method: cellpose
  # cellpose:
  #   diameter: 35  # Breast cancer cells are typically ~35 pixels
  #   channels: [DAPI]
  #   model_type: cyto2
  #   use_gpu: true
  #   patch_width_pixel: 2048
  #   patch_overlap_pixel: 100

# ═══════════════════════════════════════════════════════════════════
# AGGREGATION (using existing Xenium aggregation)
# ═══════════════════════════════════════════════════════════════════
# The Janesick data includes pre-aggregated cell x gene matrix.
# If re-aggregation is needed, configure here.

aggregate:
  use_existing: true  # Use Xenium cell_feature_matrix
  average_intensities: true
  min_transcripts: 10

# ═══════════════════════════════════════════════════════════════════
# ANNOTATION
# ═══════════════════════════════════════════════════════════════════
# Cell type annotation using marker genes for breast cancer

annotation:
  # Manual marker-based annotation
  markers:
    # Epithelial cells
    epithelial: [EPCAM, KRT18, KRT8]
    
    # Tumor cells (invasive carcinoma)
    tumor_invasive: [FASN, CEACAM6, MKI67]
    
    # DCIS (ductal carcinoma in situ)
    tumor_dcis: [CEACAM6, ESR1]
    
    # Myoepithelial cells (tumor border)
    myoepithelial: [ACTA2, KRT15, KRT14, TP63]
    
    # Fibroblasts/Stroma
    stromal: [POSTN, COL1A1, COL1A2, DCN]
    
    # Immune cells
    t_cells: [CD3E, CD3D, IL7R]
    macrophages: [ITGAX, CD68, LYZ]
    b_cells: [MS4A1, CD79A]
    
    # Endothelial cells
    endothelial: [VWF, PECAM1, CDH5]
    
  # Optionally use Tangram for automated annotation with reference
  tangram:
    enabled: false  # Set to true if you have a scRNA-seq reference
    reference: /data/references/breast_cancer_scrnaseq.h5ad
    cell_type_key: cell_type

# ═══════════════════════════════════════════════════════════════════
# CUSTOM SPATCH MODULES
# ═══════════════════════════════════════════════════════════════════
# SPATCH-specific analyses for the breast cancer sample.
#
# Every parameter below (QC thresholds, clustering resolutions, spatial
# stats toggles, ...) is the single source of truth for its module — this
# is the only place `spatch run` actually reads config from. Editing
# these values (or swapping which zarr/config a Kubeflow run points at
# via kubeflow/runs/*.run.yaml) never requires touching pipeline code.

custom_modules:
  user_module_dir: ./user_modules/

  steps:
    # ─────────────────────────────────────────────────────────────
    # QC Preprocessing (must run first — produces PCA/neighbor graph)
    # ─────────────────────────────────────────────────────────────
    # Cell/gene filtering, normalization, HVG/PCA/UMAP. Thresholds
    # relaxed for tumor samples / FFPE tissue quality.
    - module: qc_preprocessing
      enabled: true
      config:
        min_genes_per_cell: 50   # Lower threshold for tumor cells
        max_genes_per_cell: 10000  # Higher for transcriptionally active cells
        min_cells_per_gene: 5
        max_pct_mt: 25            # More permissive for FFPE
        mito_prefix: "MT-"        # Human mitochondrial genes
        target_sum: 10000
        log1p: true
        n_top_genes: 3000         # More genes for complex tumor microenvironment
        flavor: seurat_v3
        n_pcs: 50
        n_neighbors: 30           # Larger for dense Xenium data
        umap_min_dist: 0.3

    # ─────────────────────────────────────────────────────────────
    # Leiden Clustering (requires qc_preprocessing)
    # ─────────────────────────────────────────────────────────────
    # Multi-resolution clustering to capture tumor microenvironment
    # heterogeneity. Produces columns leiden_0.3, leiden_0.5, ...
    - module: leiden_clustering
      enabled: true
      config:
        resolutions: [0.3, 0.5, 0.8, 1.0, 1.5]

    # ─────────────────────────────────────────────────────────────
    # Spatial Statistics (requires leiden_clustering)
    # ─────────────────────────────────────────────────────────────
    # Spatial neighbor graph + neighborhood enrichment. Ripley/
    # co-occurrence/interactions off by default (slower, opt-in).
    - module: spatial_stats
      enabled: true
      config:
        cluster_key: leiden_0.5
        coord_type: generic
        n_neighs: 30              # Dense spatial graph for Xenium resolution
        neighborhood:
          enabled: true
        ripley:
          enabled: false
        cooccurrence:
          enabled: false
        interactions:
          enabled: false

    # ─────────────────────────────────────────────────────────────
    # DAPI Tissue Mask (must run before diffusion_analysis)
    # ─────────────────────────────────────────────────────────────
    # Generates a tissue boundary polygon from the DAPI image and
    # tags each cell with in_tissue = 0|1.  Required by diffusion_analysis.
    - module: dapi_tissue_mask
      enabled: true
      config:
        channel: 0           # DAPI channel index
        kernel_width: 500
        dilate_iterations: 2
        erode_iterations: 1
        output_shapes_key: tissue_boundary
        in_tissue_col: in_tissue

    # ─────────────────────────────────────────────────────────────
    # Cell Shape Metrics
    # ─────────────────────────────────────────────────────────────
    # Morphological analysis - important for distinguishing tumor
    # from normal epithelium and identifying invasive characteristics
    - module: cell_shape_metrics
      enabled: true
      config:
        boundaries_key: cell_boundaries
        table_key: table
        add_to_table: true
        metrics:
          - area
          - perimeter
          - circularity
          - eccentricity
          - solidity
          - aspect_ratio
    
    # ─────────────────────────────────────────────────────────────
    # Diffusion Analysis
    # ─────────────────────────────────────────────────────────────
    # Quantify transcript diffusion - particularly relevant for
    # understanding DCIS boundary dynamics
    - module: diffusion_analysis
      enabled: true
      config:
        table_key: table
        in_tissue_col: in_tissue
        buffer_distance_um: 50.0
        compute_distances: true
        batch_size: 100000

    # ─────────────────────────────────────────────────────────────
    # Pipeline Visualizations (must run last)
    # ─────────────────────────────────────────────────────────────
    # Runs scanpy preprocessing (normalize, PCA, UMAP, Leiden) and
    # generates QC + analysis figures from all upstream results.
    - module: pipeline_visualizations
      enabled: true
      config:
        table_key: table
        output_dir: ./results/janesick_breast_cancer/figures/
        figure_format: png
        figure_dpi: 300
        leiden_resolution: 0.5
        n_top_genes: 3000
        marker_genes:
          - FASN
          - CEACAM6
          - ACTA2
          - KRT15
          - POSTN
          - CD3E
          - ITGAX
          - VWF
        plots:
          - spatial_scatter
          - umap
          - cluster_composition
          - marker_heatmap
          - neighborhood_enrichment
          - cell_shape_distributions

# ═════════════════════════════════════════════════════════════════
# OUTPUT
# ═══════════════════════════════════════════════════════════════════

output:
  # Output directory
  output_dir: ./results/janesick_breast_cancer/
  
  # Zarr output
  zarr_path: ./results/janesick_breast_cancer/processed.zarr
  
  # Export formats
  export:
    # Export to Xenium Explorer for interactive visualization
    xenium_explorer: true
    
    # Export AnnData tables
    anndata: true
    anndata_path: ./results/janesick_breast_cancer/processed_table.h5ad
    
    # Export figures
    figures: true
    figure_dir: ./results/janesick_breast_cancer/figures/
    figure_format: png
    figure_dpi: 300
